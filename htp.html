<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himesh Pawar | Computer Engineering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070b1a;
            color: white;
            overflow-x: hidden;
            transition: 0.5s;
        }

        /* ================= BACKGROUND ================= */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #6c63ff;
            filter: blur(180px);
            opacity: 0.35;
            top: -150px;
            left: -150px;
            z-index: -5;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #00d4ff;
            filter: blur(180px);
            opacity: 0.25;
            bottom: -150px;
            right: -100px;
            z-index: -5;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: fixed;
            top: 15px;
            left: 5%;
            width: 90%;
            padding: 15px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow: 0 10px 40px rgba(0,0,0,0.3);

            z-index: 1000;
        }

        nav h2 {
            font-size: 28px;
            color: #00eaff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            position: relative;
        }

        nav ul li a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: #00eaff;
            transition: 0.3s;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        .dark-btn {
            border: 1px solid #00eaff;
            background: transparent;
            color: white;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 120px 20px 60px;
        }

        .hero-frame {
            position: relative;

            width: 850px;
            max-width: 95%;

            padding: 70px 40px;

            border-radius: 35px;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.2);

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5),
                inset 0 0 40px rgba(255,255,255,0.03);

            animation: frameIn 1.5s ease;
        }

        /* Animated border */

        .hero-frame::before {
            content: "";
            position: absolute;
            inset: -2px;

            border-radius: 37px;

            background: linear-gradient(
                90deg,
                transparent,
                #00eaff,
                #8a2be2,
                transparent
            );

            background-size: 300% 300%;

            z-index: -1;

            animation: borderMove 5s linear infinite;
        }

        .profile-circle {
            width: 130px;
            height: 130px;

            margin: auto;
            margin-bottom: 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 45px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #00eaff,
                #6c63ff
            );

            box-shadow:
                0 0 20px #00eaff,
                0 0 60px rgba(0,234,255,0.4);

            animation: profileFloat 3s ease-in-out infinite;
        }

        .hero h1 {
            font-size: 58px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #00eaff;
        }

        .hero h2 {
            font-size: 25px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #bbb;
            line-height: 1.8;
        }

        .typing {
            color: #00eaff;
            font-weight: bold;
        }

        /* ================= BUTTON ================= */

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;

            padding: 14px 28px;
            margin: 8px;

            border-radius: 30px;

            text-decoration: none;
            font-weight: bold;

            color: white;

            border: 1px solid #00eaff;

            transition: 0.4s;
        }

        .btn-primary {
            background: #00eaff;
            color: #061018;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px #00eaff;
        }

        /* ================= SECTIONS ================= */

        section {
            padding: 100px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 40px;
            margin-bottom: 50px;
        }

        .section-title span {
            color: #00eaff;
        }

        /* ================= ABOUT ================= */

        .about-frame {
            max-width: 900px;
            margin: auto;

            padding: 45px;

            border-radius: 25px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0,0,0,0.3);

            text-align: center;

            transition: 0.4s;
        }

        .about-frame:hover {
            transform: translateY(-8px);
            border-color: #00eaff;
        }

        .about-frame p {
            color: #ccc;
            line-height: 1.8;
            font-size: 18px;
        }

        /* ================= SKILLS ================= */

        .skills {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 25px;

            max-width: 1000px;

            margin: auto;
        }

        .skill {
            padding: 35px 20px;

            text-align: center;

            border-radius: 22px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            transition: 0.4s;

            position: relative;
            overflow: hidden;
        }

        .skill::before {
            content: "";

            position: absolute;

            width: 100%;
            height: 3px;

            top: 0;
            left: -100%;

            background: #00eaff;

            transition: 0.5s;
        }

        .skill:hover::before {
            left: 0;
        }

        .skill:hover {
            transform: translateY(-12px) scale(1.03);

            border-color: #00eaff;

            box-shadow: 0 15px 40px rgba(0,234,255,0.15);
        }

        .skill-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .skill h3 {
            margin-bottom: 10px;
        }

        .skill p {
            color: #aaa;
            font-size: 14px;
        }

        /* ================= CONTACT ================= */

        .contact-box {
            max-width: 800px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        .contact-card {
            padding: 25px;

            text-align: center;

            border-radius: 20px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.15);

            transition: 0.4s;
        }

        .contact-card:hover {
            transform: translateY(-8px);
            border-color: #00eaff;
        }

        .contact-card span {
            display: block;
            font-size: 35px;
            margin-bottom: 10px;
        }

        /* ================= CLOCK ================= */

        #clock {
            margin-top: 25px;

            font-size: 22px;

            color: #00eaff;

            font-weight: bold;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            padding: 35px;

            background: rgba(0,0,0,0.4);

            border-top: 1px solid rgba(255,255,255,0.1);

            color: #aaa;
        }

        footer span {
            color: #00eaff;
        }

        /* ================= ANIMATED PARTICLES ================= */

        .particle {
            position: fixed;

            width: 5px;
            height: 5px;

            background: #00eaff;

            border-radius: 50%;

            opacity: 0.5;

            animation: particleMove 8s linear infinite;

            z-index: -2;
        }

        .p1 {
            left: 10%;
            top: 80%;
        }

        .p2 {
            left: 30%;
            top: 20%;
            animation-delay: 2s;
        }

        .p3 {
            left: 70%;
            top: 70%;
            animation-delay: 4s;
        }

        .p4 {
            left: 90%;
            top: 30%;
            animation-delay: 1s;
        }

        /* ================= ANIMATIONS ================= */

        @keyframes frameIn {

            from {
                opacity: 0;
                transform: scale(0.85) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes borderMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes profileFloat {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes particleMove {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-150px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* ================= MOBILE ================= */

        @media(max-width: 700px) {

            nav {
                left: 2%;
                width: 96%;
            }

            nav ul {
                display: none;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero h2 {
                font-size: 20px;
            }

            .hero-frame {
                padding: 50px 20px;
            }

            .section-title {
                font-size: 30px;
            }
        }

        /* ================= DARK MODE ================= */

        body.light {
            background: #eef3ff;
            color: #111;
        }

        body.light nav,
        body.light .hero-frame,
        body.light .about-frame,
        body.light .skill,
        body.light .contact-card {
            background: rgba(255,255,255,0.75);
            color: #111;
        }

        body.light nav a {
            color: #111;
        }

        body.light .hero h2,
        body.light .hero p,
        body.light .about-frame p,
        body.light .skill p {
            color: #444;
        }

    </style>
</head>

    <!-- ================= PARTICLES ================= -->

    <div class="particle p1"></div>
    <div class="particle p2"
